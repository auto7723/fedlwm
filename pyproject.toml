[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fedlwm-artifact"
version = "1.0.0"
description = "Anonymous reference implementation of FedLWM"
requires-python = ">=3.8"
dependencies = ["numpy>=1.23", "torch>=2.0"]

[project.scripts]
fedlwm = "fedlwm.cli:main"

[tool.setuptools]
packages = ["fedlwm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
